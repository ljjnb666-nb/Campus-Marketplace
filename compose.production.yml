# =============================================================================
# Campus Marketplace — production topology
#
#   Internet ──80/443──▶ caddy ──▶ app (Next.js standalone)
#                                   ├─▶ postgres (backend, 无端口发布)
#                                   ├─▶ redis    (backend, 无端口发布)
#                                   ├─▶ minio    (可选 profile，backend，无端口发布)
#                                   └─▶ storage-cleanup (backend, 常驻单实例清理 worker，无端口发布)
#
# 原则：
# - 只有 caddy 发布 80/443；5432/6379/9000/9001/3000 一律不进公网
# - app 镜像以 GIT_SHA build arg 构建出不可变 tag，/api/health 可回报 release
# - 迁移不随 app 启动自动执行：由 scripts/ops/deploy.sh 先跑一次 migrate（见下）
# - storage-cleanup 常驻周期执行幂等清理（PENDING_DELETE / stale UPLOADING /
#   孤儿对象 / 保留期到期），与 /api/ready 完全解耦（见 docs/STORAGE.md §10）
# - secrets 全部来自 .env.production（不入 Git），镜像内不含任何秘密
#
# 常用命令（在服务器上；插值只来自 --env-file 的 .env.production）：
#   docker compose --env-file .env.production -f compose.production.yml ...
# 常用命令（封装脚本统一走 scripts/ops/lib.sh 的 compose_run）：
#   构建并启动：  --profile ops up -d --build
#   一次性迁移：  --profile ops run --rm migrate
#   备份/恢复：   scripts/ops/backup-postgres.sh / restore-postgres.sh
# =============================================================================
name: campus-marketplace-production

x-default-restart: &default-restart
  restart: unless-stopped

# 日志轮转上限（docs/LOG_PRIVACY.md §3：容器日志自然轮转即用户行为日志保留上限）
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 长驻服务的统一默认：restart + 日志轮转
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging: *default-logging

services:
  # ---- 边缘：唯一公网入口（80 只做 HTTPS 重定向，Caddy 自动处理）----
  caddy:
    image: caddy:2-alpine
    <<: *service-defaults
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # 正式域名（ACME 自动签发/续期）；无域名阶段可用 IP:443 + 手动证书模板
      SITE_ADDRESS: ${SITE_ADDRESS:?请在 .env.production 中设置 SITE_ADDRESS}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      app:
        condition: service_healthy

  # ---- 应用 ----
  app:
    build:
      context: .
      target: runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: campus-marketplace-app:${GIT_SHA:-local}
    <<: *service-defaults
    env_file: .env.production
    environment:
      NODE_ENV: production
      # 容器内对象存储走 backend 网络的服务名（自建 MinIO 时）
      # 使用外部 S3 提供商时由 .env.production 的 S3_ENDPOINT 决定
    expose:
      - "3000"
    networks:
      - edge
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---- 一次性迁移（绝不随 app 启动自动并发执行）----
  migrate:
    build:
      context: .
      target: migrator
    image: campus-marketplace-migrator:${GIT_SHA:-local}
    profiles: ["ops"]
    env_file: .env.production
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ---- 一次性生产运维检查（LAUNCH_REHEARSAL_REPAIR R1 / P1-01）----
  # 生产 connectivity/backup 检查的唯一权威执行位置。原因：compose 安全
  # 基线不发布 5432/6379/9000（PRODUCTION_SECURITY §1），宿主机无法解析
  # backend 服务名；而常驻 storage-cleanup worker 不应长期持有 backup
  # 目录文件系统权限（least privilege）。因此用专用 one-shot 诊断容器：
  #   - 仅 backend 网络、无任何端口发布、restart "no"（经 run --rm 执行）
  #   - release identity bake 进镜像（ops-runner stage 的
  #     ENV RELEASE_SHA=${GIT_SHA}），不运行时伪装
  #   - 诊断工件：不进入 deploy.sh 的 release artifact set（不扩部署生命周期）
  #   - BACKUP_DIR 契约：BACKUP_DIR 继续作为宿主机 backup/restore 脚本的
  #     权威路径（backup-postgres.sh 往该真实目录写）；本服务把同一宿主机
  #     目录只读挂载到固定容器路径 /backups（long syntax + read_only +
  #     create_host_path:false——目录不存在时显式报错，绝不静默挂空目录），
  #     服务内以 BACKUP_DIR=/backups 覆盖。ops-check 无写/删备份能力。
  #   - OBSERVE ONLY（R1 评审修复 CANONICAL_OPS_CHECK_MUTATES_OBSERVED_DEPENDENCIES）：
  #     绝不声明 depends_on——健康依赖是被检查对象，不是启动前置条件；
  #     否则 compose run 会自动拉起已停止的依赖，checker 观察到的是被
  #     诊断工具自己修复后的状态，污染事故现场。canonical 命令因此必须
  #     携带 --no-deps，DB/Redis 不可达由 checker 以 bounded FAIL 表达。
  # 唯一 canonical 执行命令（docs/OBSERVABILITY.md §7）：
  #   GIT_SHA=$(git rev-parse HEAD) docker compose --env-file .env.production \
  #     -f compose.production.yml --profile ops run --rm --no-deps --build ops-check
  ops-check:
    build:
      context: .
      target: ops-runner
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: campus-marketplace-ops-check:${GIT_SHA:-local}
    profiles: ["ops"]
    env_file: .env.production
    environment:
      NODE_ENV: production
      # 容器内一律读 /backups（宿主机真实备份目录的只读视图）
      BACKUP_DIR: /backups
    command: ["--mode", "production"]
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?请在 .env.production 中设置 BACKUP_DIR}
        target: /backups
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend
    restart: "no"

  # ---- 存储清理 worker（LR-071 审计修复：PENDING_DELETE 生产自动恢复）----
  # 单实例常驻（compose 默认 scale=1，绝不手动扩容——多实例仍安全但无必要）：
  # 仅 backend 网络、无端口发布、与 app 相同 .env.production（同一 S3/DB 配置）。
  # 周期执行幂等的 runStorageCleanup（stale UPLOADING / 超 UPLOADED /
  # 保留期到期 / PENDING_DELETE 重试），周期由 ASSET_CLEANUP_INTERVAL_SECONDS
  # 控制（默认 1800s，production 下限 60s）。与 /api/ready 完全解耦：
  # cleanup backlog 是后台恢复，不影响接流量判定。
  # 手动 escape hatch（无需宿主机 node_modules）：
  #   docker compose --env-file .env.production -f compose.production.yml \
  #     run --rm storage-cleanup --run-once [--dry-run]
  storage-cleanup:
    build:
      context: .
      target: cleanup-runner
      # LR-R2：release identity 构建期 bake（ENV RELEASE_SHA=${GIT_SHA} +
      # /app/.release-sha，ENTRYPOINT 启动时从该文件恢复并显式 export），
      # 与不可变 image tag 同源。绝不改为运行时 environment 注入——
      # 运行时注入会让同一镜像冒充任意 release；同时 env_file 的
      # RELEASE_SHA（若存在）也无法伪造身份：entrypoint 的显式赋值
      # 发生在容器 env 之后，优先级高于 env_file/Dockerfile ENV。
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: campus-marketplace-cleanup:${GIT_SHA:-local}
    <<: *service-defaults
    env_file: .env.production
    environment:
      NODE_ENV: production
      ASSET_CLEANUP_INTERVAL_SECONDS: ${ASSET_CLEANUP_INTERVAL_SECONDS:-1800}
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy

  # ---- 数据层（仅 backend 网络，无任何端口发布）----
  postgres:
    image: postgres:16-alpine
    <<: *service-defaults
    env_file: .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?请在 .env.production 中设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?请在 .env.production 中设置 POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      # FINAL REPAIR A（LR-014）：max_connections 是连接池容量公式的输入，
      # 允许按部署规模覆盖（默认 100；公式见 docs/DATABASE.md「连接池容量规划」）。
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    <<: *service-defaults
    env_file: .env.production
    # 数据分类 EPHEMERAL（仅限流计数，见 docs/PRODUCTION_DEPLOYMENT.md）：
    # 不挂持久卷；清空/重启不损伤订单、资产、账户等持久数据
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ---- 自建 MinIO（可选；使用外部 S3 提供商时不要启动本组）----
  # RB-06（2026-09-25）：官方 upstream（docker.io/minio/*）immutable digest pin，
  # 禁止 :latest floating tag（静态 gate 见 tests/ops/image-immutability.test.ts）。
  # digest 来源：docker inspect RepoDigests（真实 pull 记录，quay.io 同 manifest
  # digest 交叉印证），与 CI mirror（ghcr.io/ljjnb666-nb/*）内容为同一官方构建
  # （镜像创建时间一致）。更新流程见 docs/PRODUCTION_DEPLOYMENT.md。
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    <<: *service-defaults
    profiles: ["selfhosted-minio"]
    env_file: .env.production
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["selfhosted-minio"]
    env_file: .env.production
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./deploy/minio-app-policy.template.json:/app/policy.template.json:ro
    # 幂等初始化（可重复运行）：
    #   1. 建 public/private bucket（Phase 1 policy：public 仅匿名下载，private 全私有）
    #   2. 创建应用专用用户（S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY，非 root 凭据）
    #   3. least-privilege policy：仅两个业务 bucket 的业务读写，无任何 admin 权限
    #   4. 绑定 policy 到应用用户
    # 轮换 S3_SECRET_ACCESS_KEY 时需同步更新 MinIO 用户（见 docs/PRODUCTION_DEPLOYMENT.md）
    entrypoint: >
      /bin/bash -c "
      set -e &&
      mc alias set local \"$$MINIO_ENDPOINT\" \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/$$S3_BUCKET_PUBLIC &&
      mc mb --ignore-existing local/$$S3_BUCKET_PRIVATE &&
      mc anonymous set download local/$$S3_BUCKET_PUBLIC &&
      mc anonymous set none local/$$S3_BUCKET_PRIVATE &&
      if ! mc admin user info local \"$$S3_ACCESS_KEY_ID\" >/dev/null 2>&1; then mc admin user add local \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\"; fi &&
      if mc admin policy info local campus-app-policy >/dev/null 2>&1; then mc admin policy detach local campus-app-policy --user \"$$S3_ACCESS_KEY_ID\" && mc admin policy remove local campus-app-policy; fi &&
      POLICY_JSON=\"$$(< /app/policy.template.json)\" &&
      POLICY_JSON=\"$${POLICY_JSON//__PUBLIC_BUCKET__/$$S3_BUCKET_PUBLIC}\" &&
      POLICY_JSON=\"$${POLICY_JSON//__PRIVATE_BUCKET__/$$S3_BUCKET_PRIVATE}\" &&
      printf '%s' \"$$POLICY_JSON\" > /tmp/app-policy.json &&
      mc admin policy create local campus-app-policy /tmp/app-policy.json &&
      mc admin policy attach local campus-app-policy --user \"$$S3_ACCESS_KEY_ID\" &&
      echo 'minio-init 完成：bucket/匿名策略/应用用户 least-privilege policy 已就绪'"
    networks:
      - backend

volumes:
  pgdata:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
