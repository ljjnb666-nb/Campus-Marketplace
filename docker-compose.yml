# 固定项目名:仓库目录名含中文时,docker compose 会因无法推导项目名而报错
# ("project name must be empty" / 非法字符),显式指定以避免该问题。
name: campus-marketplace

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_marketplace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 限流计数存储（登录/注册/上传）。未配置 REDIS_URL 时应用回退进程内计数，
  # 仅单实例部署有效；多实例部署必须启动本服务。
  redis:
    image: redis:7-alpine
    container_name: campus-marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus_marketplace_pgdata:
