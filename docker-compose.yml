# 固定项目名:仓库目录名含中文时,docker compose 会因无法推导项目名而报错
# ("project name must be empty" / 非法字符),显式指定以避免该问题。
name: campus-marketplace

services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - campus_marketplace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campus_marketplace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 限流计数存储（登录/注册/上传）。未配置 REDIS_URL 时应用回退进程内计数，
  # 仅单实例部署有效；多实例部署必须启动本服务。
  redis:
    image: redis:7-alpine
    container_name: campus-marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # S3 兼容对象存储（本地开发 / 集成测试）。生产环境替换为
  # AWS S3 / Cloudflare R2 等，仅需覆盖 S3_* 环境变量，见 docs/STORAGE.md。
  # 端口用 9100/9101，避开本机常被占用的 9000/9001。
  minio:
    image: minio/minio
    container_name: campus-marketplace-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"  # S3 API（宿主机 9100 → 容器 9000）
      - "9101:9001"  # Web Console（宿主机 9101 → 容器 9001）
    volumes:
      - campus_marketplace_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # bucket 引导：幂等创建 public/private bucket 并配置匿名访问策略。
  # public = 允许匿名读、禁止匿名写；private = 完全禁止匿名访问。
  minio-init:
    image: minio/mc
    container_name: campus-marketplace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/campus-public &&
      mc mb --ignore-existing local/campus-private &&
      mc anonymous set download local/campus-public &&
      mc anonymous set none local/campus-private &&
      echo 'MinIO buckets ready'
      "
    restart: "no"

volumes:
  campus_marketplace_pgdata:
  campus_marketplace_miniodata:
