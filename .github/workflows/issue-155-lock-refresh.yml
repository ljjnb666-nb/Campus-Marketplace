# TEMPORARY one-shot workflow. Must be deleted from the Draft branch after lockfile repair.
# Never merge this privileged workflow into master. The generated dependency files
# still require the normal exact-HEAD CI and manual review.
name: Issue 155 dependency lockfile repair
on:
  push:
    branches:
      - fix/issue-155-dependency-security
    paths:
      - .github/workflows/issue-155-lock-refresh.yml
permissions:
  contents: write
jobs:
  repair-lockfile:
    if: github.repository == 'ljjnb666-nb/Campus-Marketplace'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact triggering branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Setup pinned Node 24.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - name: Update lockfile using real registry metadata
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --audit=false --save-exact next@16.3.6 eslint-config-next@16.3.6
          npm update brace-expansion --package-lock-only --ignore-scripts --audit=false
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (lock.lockfileVersion !== 3) throw new Error('lockfileVersion must remain 3');
          for (const [name, version] of [['next', '16.3.6'], ['eslint-config-next', '16.3.6']]) {
            const declared = p[(name === 'next') ? 'dependencies' : 'devDependencies'][name];
            if (declared !== version || lock.packages['node_modules/' + name]?.version !== version) {
              throw new Error(name + ' declaration/lock mismatch');
            }
          }
          for (const [name, ent] of Object.entries(lock.packages)) {
            if (/^node_modules\/(?:@next\/swc-[^/]+|@next\/env|@next\/eslint-plugin-next)$/.test(name)
                && ent.version !== '16.3.6') throw new Error(name + ' not on Next 16.3.6');
          }
          const versionIsPatched = (v) => {
            const [major, minor, patch] = v.split('.').map(Number);
            return (major === 1 && minor === 1 && patch >= 21)
              || (major === 2 && minor === 1 && patch >= 7)
              || (major === 5 && minor === 0 && patch >= 12)
              || (major === 3 && minor === 0 && patch >= 9);
          };
          const braces = Object.entries(lock.packages).filter(([name]) => name.endsWith('/node_modules/brace-expansion') || name === 'node_modules/brace-expansion');
          if (braces.length < 5) throw new Error('unexpected brace-expansion tree; manual audit required');
          for (const [name, ent] of braces) {
            if (!versionIsPatched(ent.version) || !ent.integrity?.startsWith('sha512-')) {
              throw new Error('unpatched or unverifiable ' + name + '@' + ent.version);
            }
            console.log('PATCHED', name, ent.version);
          }
          for (const pkg of ['@next/swc-win32-x64-msvc','@next/swc-linux-x64-gnu','@next/swc-darwin-arm64']) {
            if (!lock.packages['node_modules/' + pkg]?.integrity) throw new Error('missing cross-platform optional package ' + pkg);
          }
          console.log('LOCKFILE VERIFIED', Object.keys(lock.packages).length, 'entries; Next 16.3.6; brace-expansion patched');
          NODE
      - name: Verify npm ci lockfile consistency
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --audit=false --fund=false
      - name: Capture complete npm audit JSON
        shell: bash
        run: |
          set -uo pipefail
          npm audit --json > issue-155-audit.json
          rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "npm audit network/process failure: exit $rc"
            exit "$rc"
          fi
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('issue-155-audit.json', 'utf8'));
          if (audit.error || !audit.metadata?.vulnerabilities) throw new Error('npm audit JSON invalid or registry unavailable');
          console.log('NPM AUDIT COUNTS', JSON.stringify(audit.metadata.vulnerabilities));
          const lines = Object.entries(audit.vulnerabilities || {}).map(([name,v]) => ({name,severity:v.severity,isDirect:v.isDirect,via:v.via?.length,range:v.range}));
          console.log('NPM AUDIT VULNERABILITIES', JSON.stringify(lines));
          NODE
      - name: Upload raw audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-155-npm-audit-raw
          path: issue-155-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit only audited package.json and package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat -- package.json package-lock.json
          git add -- package.json package-lock.json
          if git diff --staged --quiet; then
            echo "No dependency changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(deps): patch Next.js and brace-expansion using registry lock metadata"
          git push origin HEAD:refs/heads/fix/issue-155-dependency-security
