name: Worker image runtime proof

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/worker-image-runtime.yml
      - scripts/ops/worker-image-runtime-proof.sh
      - package.json
      - package-lock.json
      - prisma/**
  workflow_dispatch:

permissions:
  contents: read

# A later PR HEAD replaces the old candidate evidence, never the exact-master CI.
concurrency:
  group: worker-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-proof:
    name: Build four real images and verify runtime identities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Build does not use production env files, credentials or a running service.
      # A missing registry image or Docker build failure is a real FAIL, not SKIP.
      - name: Build exact-SHA production Docker stages
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            "runner:campus-marketplace-app" \
            "migrator:campus-marketplace-migrator" \
            "cleanup-runner:campus-marketplace-cleanup" \
            "async-runner:campus-marketplace-async-worker"; do
            target="${item%%:*}"
            image="${item#*:}:${GITHUB_SHA}"
            docker build \
              --build-arg "GIT_SHA=${GITHUB_SHA}" \
              --target "${target}" \
              --tag "${image}" .
            printf 'BUILT stage=%s image=%s\n' "${target}" "${image}"
          done

      - name: Verify image UID, immutable SHA and Node/Prisma/tsx execution
        shell: bash
        run: bash scripts/ops/worker-image-runtime-proof.sh "${GITHUB_SHA}"
