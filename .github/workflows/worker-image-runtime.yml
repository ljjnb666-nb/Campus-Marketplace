name: Worker image runtime proof

on:
  pull_request:
    paths:
      - .dockerignore
      - Dockerfile
      - .github/workflows/worker-image-runtime.yml
      - scripts/ops/worker-image-runtime-proof.sh
      - scripts/ops/worker-isolated-cycle-proof.sh
      - scripts/ops/worker-lease-fencing-extension.sh
      - scripts/ops/worker-lease-fencing-proof.ts
      - scripts/ops/worker-lock-contention-extension.sh
      - scripts/ops/worker-lock-contention-proof.ts
      - scripts/ops/ops-runner-isolated-extension.sh
      - package.json
      - package-lock.json
      - prisma/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# A later PR HEAD replaces the old candidate evidence, never the exact-master CI.
concurrency:
  group: worker-runtime-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image-proof:
    name: Build five real images and verify runtime identities
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # On pull_request GITHUB_SHA may be a synthetic merge commit; use the
      # candidate PR HEAD for both checkout provenance and image release tags.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Build does not use production env files, credentials or a running service.
      # A missing registry image or Docker build failure is a real FAIL, not SKIP.
      - name: Build exact-SHA production Docker stages
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            "runner:campus-marketplace-app" \
            "migrator:campus-marketplace-migrator" \
            "cleanup-runner:campus-marketplace-cleanup" \
            "async-runner:campus-marketplace-async-worker"; do
            target="${item%%:*}"
            image="${item#*:}:${SOURCE_SHA}"
            docker build \
              --build-arg "GIT_SHA=${SOURCE_SHA}" \
              --target "${target}" \
              --tag "${image}" .
            printf 'BUILT stage=%s image=%s\n' "${target}" "${image}"
          # R2B: separate one-shot ops diagnostic artifact, not a worker.
          docker build --build-arg "GIT_SHA=${SOURCE_SHA}" \
            --target ops-runner \
            --tag "campus-marketplace-ops-check:${SOURCE_SHA}" .
          done

      - name: Verify image UID, immutable SHA and Node/Prisma/tsx execution
        shell: bash
        run: bash scripts/ops/worker-image-runtime-proof.sh "${SOURCE_SHA}"

      - name: Login to pinned private MinIO mirror
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Isolated network, local synthetic DB/S3 credentials only; always
      # creates new PostgreSQL/MinIO and removes them on step exit.
      - name: Real PostgreSQL MinIO worker run-once and refused-DB proof
        shell: bash
        timeout-minutes: 18
        run: bash scripts/ops/worker-isolated-cycle-proof.sh "${SOURCE_SHA}"
