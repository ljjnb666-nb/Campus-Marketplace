name: Isolated Production Image Runtime Proof

on:
  pull_request:
    paths:
      - Dockerfile
      - scripts/ops/build-runtime.mjs
      - tests/ops/image-runtime.test.sh
      - .env.production.synthetic
      - .github/workflows/production-image-runtime.yml

permissions:
  contents: read
  packages: read

concurrency:
  group: production-image-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  runtime-proof:
    name: Immutable image and isolated worker lifecycle
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      OPS_PROOF_IMAGE_PREFIX: campus-audit-remediation
      OPS_PROOF_IMAGE_TAG: proof
      OPS_PROOF_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      OPS_PROOF_MINIO_IMAGE: ghcr.io/ljjnb666-nb/minio@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
      OPS_PROOF_MC_IMAGE: ghcr.io/ljjnb666-nb/mc@sha256:eb4ea9884b77704230e2423e9004d2fa738dc272876b9cc41a297d29443b8780

    steps:
      - name: Check out exact PR HEAD (not synthetic merge SHA)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify immutable source identity
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]

      - name: Authenticate GHCR for pinned MinIO images
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull immutable dependencies
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull "$OPS_PROOF_MINIO_IMAGE"
          docker pull "$OPS_PROOF_MC_IMAGE"

      - name: Build all five image targets for exact HEAD
        run: |
          set -euo pipefail
          while read -r target kind; do
            docker build --progress=plain --target "$target" \
              --build-arg "GIT_SHA=$HEAD_SHA" \
              --tag "$OPS_PROOF_IMAGE_PREFIX-$kind:$OPS_PROOF_IMAGE_TAG" .
          done <<'TARGETS'
          migrator migrator
          runner app
          cleanup-runner cleanup
          async-runner async
          ops-runner ops
          TARGETS

      - name: Run actual isolated images and negative security probes
        run: bash tests/ops/image-runtime.test.sh

      - name: Summarize evidence boundary
        if: success()
        run: |
          echo "PASS: real Docker image runtime proof for $HEAD_SHA"
          echo "Not a production deployment, public TLS check, alert delivery or offsite recovery proof"
