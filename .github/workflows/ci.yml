name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: verify (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 .env.example 的连接串格式保持一致;指向 CI 服务容器中的 PostgreSQL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package-lock.json 在 Linux 容器（node:24）中生成：Windows 上的 npm 会按平台裁剪
          # 可选依赖条目（如 @tailwindcss/oxide-linux-*），导致 Linux 上 npm ci 报 Missing
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deploy database migrations
        run: npx prisma migrate deploy

      - name: Test with coverage thresholds
        run: npm run test:coverage
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public
          # 限流集成测试指向 CI 服务容器中的 Redis（未设置时该测试跳过）
          INTEGRATION_REDIS_URL: redis://localhost:6379
          # 部分测试的导入链会校验 next-auth 环境变量（本地由 .env 提供）
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: dummy-secret-for-ci-tests-only

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: dummy-secret-for-ci-build-only
          APP_NAME: 校园集市
          DEFAULT_CAMPUS_SLUG: main-campus
          UPLOAD_DIR: ./public/uploads
