name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: verify (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 .env.example 的连接串格式保持一致;指向 CI 服务容器中的 PostgreSQL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package-lock.json 在 Linux 容器（node:24）中生成：Windows 上的 npm 会按平台裁剪
          # 可选依赖条目（如 @tailwindcss/oxide-linux-*），导致 Linux 上 npm ci 报 Missing
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Actions 的 service container 不支持 command 覆盖，
      # minio/minio 无参启动只会打印 usage 后退出（run 33133052499 的根因）。
      # 因此 MinIO 改为步骤内显式 docker run server，并在 runner 侧等待健康端点。
      - name: Start MinIO (S3 compatible storage)
        run: |
          docker run -d --name minio \
            -p 9100:9000 -p 9101:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9100/minio/health/ready > /dev/null; then
              echo "MinIO ready after ${i} probe(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to become ready; container logs:"
          docker logs minio
          exit 1

      - name: Bootstrap MinIO buckets
        # 幂等创建 public/private bucket 并设置匿名策略：
        # public = 允许匿名读（禁止写）；private = 完全禁止匿名访问
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c "
            mc alias set local http://localhost:9100 minioadmin minioadmin &&
            mc mb --ignore-existing local/campus-public &&
            mc mb --ignore-existing local/campus-private &&
            mc anonymous set download local/campus-public &&
            mc anonymous set none local/campus-private
          "

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deploy database migrations (fresh)
        run: npx prisma migrate deploy

      - name: Deploy database migrations (idempotent re-run)
        run: npx prisma migrate deploy

      - name: Test with coverage thresholds
        run: npm run test:coverage
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public
          # 限流集成测试指向 CI 服务容器中的 Redis（未设置时该测试跳过）
          INTEGRATION_REDIS_URL: redis://localhost:6379
          # MinIO 集成测试：真实 S3 API 全链路（bucket/上传/签名/匿名策略/清理）
          INTEGRATION_S3_ENDPOINT: http://localhost:9100
          # 部分测试的导入链会校验 next-auth 环境变量（本地由 .env 提供）
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: dummy-secret-for-ci-tests-only

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: dummy-secret-for-ci-build-only
          APP_NAME: 校园集市
          DEFAULT_CAMPUS_SLUG: main-campus

  # ==========================================================
  # Release Gate：真实浏览器关键链路 E2E（Playwright + 真实
  # PostgreSQL / Redis / MinIO + production build）
  # 禁止 continue-on-error / || true / allow-failure
  # ==========================================================
  e2e:
    name: e2e (playwright critical paths)
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # E2E 专用库：与 verify job 的 campus 库互不干扰
          POSTGRES_DB: campus_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # prisma.config 加载时校验该变量；实际迁移走 e2e-setup（E2E_DATABASE_URL）
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_e2e?schema=public
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus_e2e?schema=public
      E2E_REDIS_URL: redis://localhost:6379
      E2E_S3_ENDPOINT: http://localhost:9100
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: e2e-only-nextauth-secret-not-for-prod
      ALLOW_LOCAL_S3_IN_PRODUCTION: "true"
      APP_NAME: 校园集市
      DEFAULT_CAMPUS_SLUG: main-campus

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Start MinIO (S3 compatible storage)
        run: |
          docker run -d --name minio \
            -p 9100:9000 -p 9101:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9100/minio/health/ready > /dev/null; then
              echo "MinIO ready after ${i} probe(s)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to become ready; container logs:"
          docker logs minio
          exit 1

      - name: Bootstrap MinIO buckets
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c "
            mc alias set local http://localhost:9100 minioadmin minioadmin &&
            mc mb --ignore-existing local/campus-public &&
            mc mb --ignore-existing local/campus-private &&
            mc anonymous set download local/campus-public &&
            mc anonymous set none local/campus-private &&
            mc admin user add local e2e-local E2eLocalSecret2026x &&
            mc admin policy attach local readwrite --user e2e-local
          "

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build production bundle
        run: npm run build

      # E2E deterministic bootstrap：migrate deploy + 全量重置 + 确定性账号 + Redis 限流清理
      - name: E2E setup (migrate / reset / seed / rate-limit flush)
        run: npm run e2e:setup

      # webServer 由 playwright.config.ts 拉起（npm run start，指向 campus_e2e）
      - name: Run Playwright critical-path suite
        run: npx playwright test

      - name: E2E teardown (MinIO / Redis cleanup)
        if: always()
        run: npm run e2e:teardown

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            tests/e2e/.report
            tests/e2e/.artifacts
          retention-days: 7
