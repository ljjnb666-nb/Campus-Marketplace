name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    name: verify (lint / typecheck / test / build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 与 .env.example 的连接串格式保持一致;指向 CI 服务容器中的 PostgreSQL
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与生成 package-lock.json 的本地环境（npm 11）保持一致，
          # 低版本 npm 的 npm ci 会认为该 lock 文件缺少依赖条目
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Deploy database migrations
        run: npx prisma migrate deploy

      - name: Test with coverage thresholds
        run: npm run test:coverage
        env:
          INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/campus?schema=public

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: dummy-secret-for-ci-build-only
          APP_NAME: 校园集市
          DEFAULT_CAMPUS_SLUG: main-campus
          UPLOAD_DIR: ./public/uploads
